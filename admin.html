<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>REKSUS | Portal Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #1d4ed8;
    --primary-dark: #1e3a8a;
    --primary-light: #dbeafe;
    --accent: #f59e0b;
    --bg: #eff6ff;
    --surface: #ffffff;
    --text: #1e3a8a;
    --muted: #6b7280;
    --border: #bfdbfe;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(29,78,216,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 85% 80%, rgba(245,158,11,0.10) 0%, transparent 55%),
      radial-gradient(ellipse 50% 50% at 60% 30%, rgba(219,234,254,0.35) 0%, transparent 50%);
    z-index: 0;
  }

  .deco-circle {
    position: fixed;
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }
  .deco-circle-1 {
    width: 500px; height: 500px;
    border: 1.5px solid rgba(29,78,216,0.10);
    top: -150px; right: -150px;
    animation: spin 45s linear infinite;
  }
  .deco-circle-2 {
    width: 320px; height: 320px;
    border: 1.5px solid rgba(245,158,11,0.12);
    bottom: -100px; left: -80px;
    animation: spin 35s linear infinite reverse;
  }
  .deco-circle-3 {
    width: 180px; height: 180px;
    border: 1px dashed rgba(29,78,216,0.08);
    top: 35%; left: 5%;
    animation: spin 25s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .dots {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: radial-gradient(rgba(29,78,216,0.12) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black, transparent);
  }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(29,78,216,0.15);
    border-radius: 28px;
    padding: 48px 44px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow:
      0 4px 6px rgba(29,78,216,0.06),
      0 20px 60px rgba(29,78,216,0.12),
      0 0 0 1px rgba(255,255,255,0.8) inset;
    animation: slideUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(32px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--primary-light);
    color: var(--primary-dark);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 5px 12px;
    border-radius: 100px;
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  .badge-dot {
    width: 6px; height: 6px;
    background: var(--primary);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  /* Shield icon */
  .shield-wrap {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, #1d4ed8, #1e40af);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
    box-shadow: 0 8px 20px rgba(29,78,216,0.3);
  }

  .logo-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 56px;
    letter-spacing: 0.04em;
    line-height: 1;
    background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 50%, #3b82f6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .logo-sub {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-top: 2px;
  }
  .logo-inst {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
    margin-top: 8px;
  }

  .divider {
    height: 1px;
    background: linear-gradient(to right, transparent, var(--border), transparent);
    margin: 24px 0;
  }

  .desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 28px;
  }

  /* Warning box */
  .warning {
    display: flex;
    gap: 10px;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 24px;
    font-size: 12px;
    color: #92400e;
    line-height: 1.5;
  }
  .warning-icon { flex-shrink: 0; margin-top: 1px; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px 24px;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.2s cubic-bezier(0.22,1,0.36,1);
    position: relative;
    overflow: hidden;
  }
  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .btn:hover::after { opacity: 0.1; }
  .btn:active { transform: scale(0.98); }

  .btn-primary {
    background: linear-gradient(135deg, #1d4ed8, #1e3a8a);
    color: white;
    box-shadow: 0 4px 20px rgba(29,78,216,0.35), 0 1px 3px rgba(29,78,216,0.2);
  }
  .btn-primary:hover {
    box-shadow: 0 8px 28px rgba(29,78,216,0.45), 0 1px 3px rgba(29,78,216,0.2);
    transform: translateY(-1px);
  }

  .btn-icon { width: 20px; height: 20px; flex-shrink: 0; }

  .footer {
    position: relative;
    z-index: 1;
    margin-top: 24px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    animation: fadeIn 1s 0.5s both;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    margin-top: 16px;
    padding: 8px 16px;
    border-radius: 100px;
    border: 1px solid var(--border);
    transition: all 0.2s;
    background: rgba(255,255,255,0.7);
  }
  .back-link:hover {
    color: var(--primary-dark);
    border-color: var(--primary-light);
    background: white;
  }
</style>
</head>
